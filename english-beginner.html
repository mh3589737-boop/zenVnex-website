<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAZD-W1lwdu6bI71T9FW8cIz--7qlVQC-4",
      authDomain: "zenvnex.firebaseapp.com",
      projectId: "zenvnex",
      storageBucket: "zenvnex.firebasestorage.app",
      messagingSenderId: "145639804249",
      appId: "1:145639804249:web:d8d216db1c713986aad048",
      measurementId: "G-B554BNES3M"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // 🔴 تنظیمات باز یا قفل بودن درس‌ها 🔴
    // الان true است یعنی همه درس‌ها باز هستند.
    // بعداً اگر خواستی شرطی شود، این را false کن!
    const UNLOCK_ALL = true; 

    const lessons = [
      { id: 0, title: "الفبای انگلیسی", desc: "حروف A تا Z + تلفظ", link: "alphabet.html" },
      { id: "0b", title: "کوئیز الفبا", desc: "تمرین و آزمون حروف", link: "quiz.html" },
      { id: 1, title: "سلام و معرفی", desc: "Hello, My name is...", link: "lesson-1.html" },
      { id: 2, title: "خانواده من", desc: "اعضای خانواده", link: "lesson-2.html" },
      { id: 3, title: "در خانه", desc: "اشیای خانه و مکان‌ها", link: "lesson-3.html" },
      { id: 4, title: "مرور ۱", desc: "ترکیب درس‌های ۱ تا ۳", link: "lesson-4.html" },
      { id: 5, title: "اعداد و سن", desc: "اعداد ۱ تا ۲۰ + سن", link: "lesson-5.html" },
      { id: 6, title: "رنگ‌ها و لباس", desc: "رنگ‌ها و لباس‌ها", link: "lesson-6.html" },
      { id: 7, title: "غذا و نوشیدنی", desc: "I like / I don’t like", link: "lesson-7.html" },
      { id: 8, title: "مرور ۲", desc: "ترکیب درس‌های ۵ تا ۷", link: "lesson-8.html" },
      { id: 9, title: "بدن من و سلامتی", desc: "اعضای بدن + احساسات", link: "lesson-9.html" },
      { id: 10, title: "مدرسه و یادگیری", desc: "لوازم مدرسه + I can...", link: "lesson-10.html" },
      { id: 11, title: "رویاهای من", desc: "شغل‌های آینده", link: "lesson-11.html" },
      { id: 12, title: "مرور نهایی", desc: "آزمون جامع سطح مبتدی", link: "lesson-12.html" }
    ];

    auth.onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      // خواندن پیشرفت از LocalStorage
      const progress = JSON.parse(localStorage.getItem("zenvnex_beginner_progress") || "{}");

      const list = document.getElementById("lessonsList");
      list.innerHTML = "";

      lessons.forEach((lesson, index) => {
        let status = "locked";

        if (UNLOCK_ALL) {
          // اگر حالت همه باز فعال باشد
          status = progress[lesson.id] === "completed" ? "completed" : "current";
        } else {
          // منطق شرطی و مرحله‌ای
          if (index === 0) {
            status = progress[lesson.id] === "completed" ? "completed" : "current";
          } else {
            const prevId = lessons[index - 1].id;
            if (progress[prevId] === "completed") {
              status = progress[lesson.id] === "completed" ? "completed" : "current";
            }
          }
        }

        const item = document.createElement(status === "locked" ? "div" : "a");
        if (status !== "locked") {
          item.href = lesson.link;
        }

        item.className = `lesson-item ${status}`;

        item.innerHTML = `
          <div class="lesson-number">${lesson.id === 0 ? "۰" : lesson.id}</div>
          <div class="lesson-info">
            <h3>${lesson.title}</h3>
            <p>${lesson.desc}</p>
          </div>
          <div class="lesson-status">
            ${status === "completed" ? "تکمیل شده" : 
              status === "current" ? "باز" : "قفل"}
          </div>
        `;

        list.appendChild(item);
      });
    });
  </script>
