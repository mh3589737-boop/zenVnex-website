<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENVNEX Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box; margin:0; padding:0;}
        body{background:#000; color:#fff; font-family:'Inter', sans-serif; min-height:100vh; display:flex; flex-direction:column;}
        
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 30px 50px; border-bottom: 1px solid rgba(255,255,255,0.1); 
        }
        .logo { font-size: 20px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #fff; text-decoration: none; }
        .btn { 
            background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; 
            padding: 10px 24px; border-radius: 4px; cursor: pointer; font-weight: 500; 
            font-size: 12px; letter-spacing: 1px; text-transform: uppercase; text-decoration: none; 
            transition: 0.3s; 
        }
        .btn:hover { background: #fff; color: #000; border-color: #fff; }

        .main-content { flex: 1; padding: 80px 50px; text-align: center; max-width: 900px; margin: 0 auto; }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            max-width: 900px;
            margin: 0 auto;
        }
        .level-card {
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 40px 20px;
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
            display: block;
        }
        .level-card:hover {
            border-color: #fff;
            transform: translateY(-8px);
        }
        .level-card h3 { font-size: 24px; margin-bottom: 8px; }
        .level-card p { font-size: 14px; color: rgba(255,255,255,0.6); }

        @media(max-width: 768px) {
            .levels-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="logo">ZENVNEX</a>
    <div>
      <a href="lesson.html" class="btn">بازگشت به انتخاب درس</a>
      <a href="dashboard.html" class="btn">Dashboard</a>
    </div>
  </div>

  <div class="main-content" id="content">
    <div style="text-align:center; padding:100px 20px; color:#a1a1aa;">
      در حال بررسی وضعیت لاگین...<br><br>
      <small>F12 → Console را باز کن</small>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAZD-W1lwdu6bI71T9FW8cIz--7qlVQC-4",
      authDomain: "zenvnex.firebaseapp.com",
      projectId: "zenvnex",
      storageBucket: "zenvnex.firebasestorage.app",
      messagingSenderId: "145639804249",
      appId: "1:145639804249:web:d8d216db1c713986aad048",
      measurementId: "G-B554BNES3M"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const content = document.getElementById("content");

    auth.onAuthStateChanged((user) => {
      console.log("===== نتیجه Auth =====");
      console.log(user);

      if (user) {
        console.log("✅ لاگین هستی");
        console.log("UID:", user.uid);
        console.log("Email:", user.email);

        const urlParams = new URLSearchParams(window.location.search);
        const subject = urlParams.get("subject") || "english";

        if (subject === "english") {
          content.innerHTML = `
            <div style="text-align:center; margin-bottom:40px;">
              <h2 style="font-size:28px; margin-bottom:8px;">انگلیسی</h2>
              <p style="color:#a1a1aa;">سطح مناسب خودت را انتخاب کن</p>
            </div>

            <div class="levels-grid">
              <a href="english-beginner.html" class="level-card">
                <h3>مبتدی</h3>
                <p>شروع از صفر • الفبا تا مکالمه ساده</p>
              </a>

              <a href="#" class="level-card" onclick="alert('این سطح به زودی اضافه می‌شود 🌱'); return false;">
                <h3>متوسط</h3>
                <p>مکالمه روزمره و گرامر پیشرفته‌تر</p>
              </a>

              <a href="#" class="level-card" onclick="alert('این سطح به زودی اضافه می‌شود 🌱'); return false;">
                <h3>پیشرفته</h3>
                <p>مهارت‌های حرفه‌ای و آکادمیک</p>
              </a>
            </div>
          `;
        } else {
          content.innerHTML = `
            <div style="text-align:center; padding:80px 20px;">
              <p style="font-size:18px; color:#a1a1aa;">این بخش به زودی آماده می‌شود</p>
              <a href="lesson.html" style="display:inline-block; margin-top:20px; color:#34d399;">بازگشت به انتخاب زبان</a>
            </div>
          `;
        }
      } else {
        console.log("❌ لاگین نیستی (user = null)");
        content.innerHTML = `
          <div style="text-align:center; padding:80px 20px; color:#f87171;">
            <h2>کاربر لاگین تشخیص داده نشد</h2>
            <p style="margin-top:15px;">Firebase کاربر را null برگردانده</p>
            <br>
            <a href="index.html" style="color:#34d399;">رفتن به صفحه اصلی</a>
          </div>
        `;
      }
    });
  </script>

</body>
</html>
