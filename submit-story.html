<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<link rel="icon" type="image/png" href="logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ارسال امن داستان — ZENVNEX</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-space: #050505;
    --panel-space: #0c0d10;
    --border-space: #22262e;
    --text-main: #f0f2f5;
    --text-muted: #9ba1a6;
    --accent-gold: #c5a880;
    --maxw: 720px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg-space);
    color: var(--text-main);
    font-family: 'Vazirmatn', 'Inter', system-ui, -apple-system, sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:48px 24px;}
  
  header{
    border-bottom: 1px solid var(--border-space);
    padding: 18px 0 24px;
    margin-bottom: 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo{ 
    font-size: 18px; 
    font-weight: 700; 
    color: #fff; 
    text-decoration:none; 
    letter-spacing: 3px;
    font-family: 'Inter', sans-serif;
  }
  .btn-back{
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    border: 1px solid var(--border-space);
    padding: 8px 18px;
    transition: all 0.25s ease;
    letter-spacing: 0.5px;
  }
  .btn-back:hover{ 
    border-color: #fff; 
    color: #fff; 
  }

  .form-card{
    background: var(--panel-space);
    border: 1px solid var(--border-space);
    padding: 42px 36px;
  }
  .form-card h1{
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #fff;
    letter-spacing: -0.3px;
  }
  .form-card > p{
    color: var(--text-muted);
    font-size: 15px;
    margin-bottom: 36px;
    line-height: 1.7;
  }

  .form-group{
    margin-bottom: 26px;
  }
  .form-group label{
    display: block;
    font-size: 14.5px;
    font-weight: 500;
    margin-bottom: 10px;
    color: var(--text-main);
  }
  .form-control{
    width: 100%;
    background: #050505;
    border: 1px solid var(--border-space);
    padding: 14px 18px;
    color: #fff;
    font-family: 'Vazirmatn', inherit;
    font-size: 15px;
    outline: none;
    transition: border-color 0.25s ease;
    border-radius: 0;
  }
  .form-control:focus{
    border-color: var(--accent-gold);
  }
  .form-control::placeholder{
    color: #666;
  }
  textarea.form-control{
    resize: vertical;
    min-height: 200px;
    line-height: 1.8;
  }

  .checkbox-group{
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 18px;
  }
  .checkbox-group input{
    margin-top: 5px;
    accent-color: var(--accent-gold);
  }
  .checkbox-group label{
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.6;
    cursor: pointer;
  }

  .btn-submit{
    width: 100%;
    background: #fff;
    color: #000;
    border: none;
    padding: 16px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.25s ease;
    margin-top: 18px;
    letter-spacing: 0.3px;
    font-family: 'Vazirmatn', sans-serif;
  }
  .btn-submit:hover{
    background: #e8e8e8;
  }
  .btn-submit:active{
    transform: scale(0.99);
  }

  @media (max-width: 600px) {
    .wrap{padding: 30px 16px;}
    .form-card{padding: 28px 20px;}
    .form-card h1{font-size: 22px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a href="index.html" class="logo">ZENVNEX</a>
    <a href="lifestory.html" class="btn-back">بازگشت ←</a>
  </header>

  <main>
    <div class="form-card">
      <h1>ارسال امن روایت شما</h1>
      <p>داستان شما به‌صورت کاملاً محرمانه و رمزنگاری‌شده ارسال می‌شود. تیم ما با دقت و احترام به حریم خصوصی شما آن را بررسی خواهد کرد.</p>

      <form id="storyForm">
        <div class="form-group">
          <label for="pseudonym">نام مستعار (جهت حفظ امنیت شما)</label>
          <input type="text" id="pseudonym" class="form-control" placeholder="مثلاً: دختر خورشید یا ناشناس" required>
        </div>

        <div class="form-group">
          <label for="title">عنوان داستان</label>
          <input type="text" id="title" class="form-control" placeholder="یک عنوان کوتاه و معنادار انتخاب کنید" required>
        </div>

        <div class="form-group">
          <label for="storyContent">متن اصلی داستان / اتفاقات رخ داده</label>
          <textarea id="storyContent" class="form-control" placeholder="داستان، چالش‌ها و اتفاقاتی که تجربه کرده‌اید را با جزئیات بنویسید..." required></textarea>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="consentPublic">
          <label for="consentPublic">اجازه می‌دهم داستانم پس از بررسی، به‌صورت کاملاً ناشناس در وب‌سایت برای آگاهی عموم منتشر شود.</label>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="consentPrivate" checked>
          <label for="consentPrivate">اطلاعات من کاملاً محرمانه بماند و فقط تیم مدیریتی ZENVNEX آن را مطالعه کند.</label>
        </div>

        <button type="submit" class="btn-submit">ارسال امن داستان</button>
      </form>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAZD-W1lwdu6bI71T9FW8cIz--7qlVQC-4",
    authDomain: "zenvnex.firebaseapp.com",
    projectId: "zenvnex",
    storageBucket: "zenvnex.firebasestorage.app",
    messagingSenderId: "145639804249",
    appId: "1:145639804249:web:d8d216db1c713986aad048",
    measurementId: "G-B554BNES3M"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  const db = firebase.firestore();

  firebase.auth().onAuthStateChanged((user) => {
    if (!user) {
      window.location.href = "lifestory.html";
    }
  });

  const storyForm = document.getElementById('storyForm');

  storyForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const user = firebase.auth().currentUser;

    if (!user) {
      alert("لطفاً ابتدا وارد حساب کاربری خود شوید.");
      window.location.href = "lifestory.html";
      return;
    }

    const userId = user.uid;
    const pseudonym = document.getElementById('pseudonym').value.trim();
    const title = document.getElementById('title').value.trim();
    const storyContent = document.getElementById('storyContent').value.trim();
    const consentPublic = document.getElementById('consentPublic').checked;
    const consentPrivate = document.getElementById('consentPrivate').checked;

    try {
      await db.collection('stories').add({
        userId: userId,
        pseudonym: pseudonym,
        title: title,
        content: storyContent,
        allowPublic: consentPublic,
        keepPrivate: consentPrivate,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      alert("داستان شما با موفقیت و به‌صورت کاملاً امن دریافت شد.");
      storyForm.reset();
      window.location.href = "lifestory.html";

    } catch (error) {
      console.error("خطا در ارسال داستان:", error);
      alert("خطایی رخ داد. لطفاً دوباره تلاش کنید.");
    }
  });
</script>

</body>
</html>
